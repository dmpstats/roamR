url: https://dmpstats.github.io/roamR/
template:
  bootstrap: 5
  light-switch: true

navbar:
  structure:
    left:  [intro, FAQ, reference, articles, forum, news]
    right: [search, github, lightswitch]

  components:
    FAQ:
      text: FAQ
      href: articles/faq.html
    articles:
      text: Articles
      menu:
      - text: roamR Overview
        href: articles/roamR-guide.html
      - text: -------
      - text: Case Studies
      - text: Guillemot in the Isle of May
        href: articles/case-study-guillemot.html
    forum:
      text: Forum
      href: https://github.com/dmpstats/roamR/discussions



reference:
- title: IBM setup
  desc: High-level IBM controls and definitions
  contents:
  - matches("IBM")
  - matches("ModelConfig")
- title: Species definitions
  desc: Species/simulated population level functions
  contents:
  - matches("Spec")
- title: Environment definitions
  desc: Functions relating to the driver definitions
  contents:
  - matches("Driv")
- title: Classes
  desc: Class definitions
  contents:
  - matches("class")
- title: Alphabetical
  desc: Complete list of user-facing functions
  contents:
  - matches(".*")
